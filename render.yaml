services:
  - type: web
    name: medcare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
